# Мониторинг конкурентов: позиция = НАШ SKU (модель × комплектация).
#
# queries     — текстовые запросы, по которым ozon_scout ищет выдачу. Карточку
#               конкурента напрямую дёргать нельзя (403 антибот) — только поиск.
# price_band  — ценовой коридор, отсекает аксессуары. Шире = лучше: лишнее отфильтрует LLM.
# matched     — ВЫВЕРЕННЫЕ конкуренты (та же модель И та же комплектация).
#               Заполняется матчером: playbooks/competitor-matching.md → scripts/apply_matches.py.
#               Ложный матч = ложная ценовая тревога, поэтому при сомнении — не матчить.
#
# Ниже — заготовка на один SKU. Размножьте под свой ассортимент.
version: 2
defaults:
  pages: 3
  alert:
    undercut_pink: true   # алерт, если конкурент дешевле нас по «розовой» цене (Ozon Карта)
    move_pct: 4           # алерт, если чья-то цена сдвинулась больше чем на N%
products:
  '000000000':            # ← наш SKU
    name: Модель · комплектация
    model: Модель
    config: base
    queries:
    - Модель
    price_band:
    - 20000
    - 100000
    matched: []
